<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hukuk Tarihi: Yazılı ve Yazısız Hukuk</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; }
        .progress { color: var(--accent); font-weight: bold; margin-bottom: 1rem; }
        h2 { color: var(--primary); font-size: 1.25rem; margin-bottom: 1.5rem; }
        .option-btn { display: block; width: 100%; padding: 12px 20px; margin: 10px 0; border: 2px solid #edf2f7; border-radius: 10px; background: white; cursor: pointer; text-align: left; transition: all 0.2s; font-size: 1rem; }
        .option-btn:hover { border-color: var(--accent); background: #ebf8ff; }
        #status { font-size: 0.85rem; color: #718096; margin-top: 1rem; text-align: center; }
        .result-screen { text-align: center; display: none; }
        .reset-btn { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-box">
        <div class="progress" id="progress">Soru 1 / 5</div>
        <h2 id="question">Yükleniyor...</h2>
        <div id="options"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>🏁 Test Bitti!</h1>
        <p id="final-score" style="font-size: 2rem; font-weight: bold; color: var(--primary);"></p>
        <div id="status">Skor Supabase'e gönderiliyor...</div>
        <button onclick="location.reload()" class="reset-btn">Yeniden Başla</button>
    </div>
</div>

<script>
    // --- SUPABASE BAĞLANTISI ---
    const SB_URL = "https://xuvrtgvzosobhwpyglsz.supabase.co";
    const SB_KEY = "Sb_publishable_uyuYnuRcWL4dxgsBp_lA7w_9KBjIt1s";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Notlarından ve Yazılı Hukuk Konusundan Sorular
    const questions = [
        { 
            s: "Yazısız bir kuralın hukuk sayılabilmesi için 'uzun süredir kesintisiz uygulanıyor olması' hangi unsurdur?", 
            o: ["Manevi Unsur", "Maddi Unsur", "Siyasi Unsur", "Dini Unsur"], 
            c: 1 
        },
        { 
            s: "Eski Türklerde törenin 'adalet' anlamına gelen ve asla değişmeyen ilkesi hangisidir?", 
            o: ["Uzluk (İyilik)", "Tüzlük (Eşitlik)", "Könilik (Adalet)", "Kurultay"], 
            c: 2 
        },
        { 
            s: "Mezopotamya hukukunda kökleşmiş olan 'Göze göz, dişe diş' anlayışına ne ad verilir?", 
            o: ["Töre", "Yazılı Metin", "Kısas İlkesi", "Sertlik"], 
            c: 2 
        },
        { 
            s: "Tarihte bilinen İLK YAZILI kanunlar hangi Sümer kralı tarafından yapılmıştır?", 
            o: ["Hamurabi", "Urugakina", "Sargon", "Anu"], 
            c: 1 
        },
        { 
            s: "Aşağıdakilerden hangisi yazılı hukuku yazısız hukuktan ayıran en temel özelliktir?", 
            o: ["Daha esnek olması", "Sadece din temelli olması", "Resmi bir metne dayanması", "Daha eski olması"], 
            c: 2 
        }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById("progress").innerText = `Soru ${currentIdx + 1} / ${questions.length}`;
        document.getElementById("question").innerText = q.s;
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        q.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${String.fromCharCode(65 + i)}) ${opt}`;
            btn.onclick = () => handleAnswer(i);
            optionsDiv.appendChild(btn);
        });
    }

    async function handleAnswer(selectedIdx) {
        if (selectedIdx === questions[currentIdx].c) score++;
        
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    async function showResult() {
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").innerText = `${score} / ${questions.length}`;

        try {
            const { error } = await _supabase
                .from('skorlar') // Tablo ismin: skorlar
                .insert([{ puan: score }]); // Sütun ismin: puan
            
            if (error) throw error;
            document.getElementById("status").innerText = "✅ Skor veritabanına kaydedildi!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ Kayıt başarısız (RLS ayarlarını kontrol et)";
            console.error("Hata:", err);
        }
    }

    loadQuestion();
</script>

</body>
</html>
