<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hukuk Tarihi Quiz</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; --success: #2ecc71; --error: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        #quiz-container { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 500px; }
        .progress { color: var(--accent); font-weight: bold; margin-bottom: 1rem; text-align: center; }
        h2 { color: var(--primary); font-size: 1.2rem; margin-bottom: 1.5rem; min-height: 3em; }
        .option-btn { display: block; width: 100%; padding: 12px 20px; margin: 10px 0; border: 2px solid #edf2f7; border-radius: 10px; background: white; cursor: pointer; text-align: left; transition: 0.3s; font-size: 1rem; outline: none; }
        
        /* Renk Sınıfları */
        .correct { background-color: var(--success) !important; color: white !important; border-color: var(--success) !important; }
        .wrong { background-color: var(--error) !important; color: white !important; border-color: var(--error) !important; }
        .disabled { pointer-events: none; opacity: 0.8; }

        .result-screen { text-align: center; display: none; }
        .reset-btn { background: var(--accent); color: white; border: none; padding: 12px 30px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz-box">
        <div class="progress" id="progress">Yükleniyor...</div>
        <h2 id="question">Soru yükleniyor...</h2>
        <div id="options"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>🏁 Test Bitti!</h1>
        <p id="final-score" style="font-size: 2.5rem; font-weight: bold; color: var(--primary); margin: 10px 0;"></p>
        <div id="status" style="font-size: 0.9rem; color: #718096;">Skor gönderiliyor...</div>
        <button onclick="location.reload()" class="reset-btn">Yeniden Başla</button>
    </div>
</div>

<script>
    const SB_URL = "https://xuvrtgvzosobhwpyglsz.supabase.co";
    const SB_KEY = "Sb_publishable_uyuYnuRcWL4dxgsBp_lA7w_9KBjIt1s";
    const _supabase = supabase.createClient(SB_URL, SB_KEY);

    // Notlarından derlenen sorular
    let questions = [
        { s: "Yazısız bir kuralın hukuk sayılabilmesi için 'toplumun kuralın zorunlu olduğuna dair sarsılmaz inancı' hangi unsurdur?", o: ["Maddi Unsur", "Manevi Unsur", "Siyasi Unsur", "Dini Unsur"], c: 1 },
        { s: "Türk töresinde 'adalet' (Könilik), 'iyilik' (Uzluk) ve 'eşitlik' (Tüzlük) ilkeleri için hangisi söylenebilir?", o: ["Kurultayda değiştirilir", "Asla değişmez temel ilkelerdir", "Sadece yazılı hukukta vardır", "Zamanla önemini yitirmiştir"], c: 1 },
        { s: "Mezopotamya'da yazılı metinler öncesinde kökleşmiş, suçluya suçun aynısının uygulanması esasına dayanan anlayış nedir?", o: ["Töre", "Kısas", "Uygulama", "Dinsel Bağlantı"], c: 1 },
        { s: "Tarihte bilinen ilk yazılı kanunları yapan Sümer kralı kimdir?", o: ["Hamurabi", "Urugakina", "Nabukadnezar", "Sargon"], c: 1 },
        { s: "Babil (Hamurabi) kanunlarını diğerlerinden ayıran en belirgin özellik nedir?", o: ["Daha yumuşak olması", "Çok sert ve sistematik olması", "Sadece sözlü olması", "Dini unsurlar içermemesi"], c: 1 }
    ];

    // Soruları Karıştırma Fonksiyonu (Shuffle)
    questions = questions.sort(() => Math.random() - 0.5);

    let currentIdx = 0;
    let score = 0;
    let canClick = true;

    function loadQuestion() {
        canClick = true;
        const q = questions[currentIdx];
        document.getElementById("progress").innerText = `Soru ${currentIdx + 1} / ${questions.length}`;
        document.getElementById("question").innerText = q.s;
        const optionsDiv = document.getElementById("options");
        optionsDiv.innerHTML = "";

        q.o.forEach((opt, i) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${String.fromCharCode(65 + i)}) ${opt}`;
            btn.onclick = () => handleAnswer(i, btn);
            optionsDiv.appendChild(btn);
        });
    }

    async function handleAnswer(selectedIdx, clickedBtn) {
        if (!canClick) return;
        canClick = false;

        const correctIdx = questions[currentIdx].c;
        const buttons = document.querySelectorAll(".option-btn");

        // Renklendirme Mantığı
        if (selectedIdx === correctIdx) {
            clickedBtn.classList.add("correct");
            score++;
        } else {
            clickedBtn.classList.add("wrong");
            buttons[correctIdx].classList.add("correct"); // Doğru olanı da göster
        }

        // Diğer butonları etkisizleştir
        buttons.forEach(btn => btn.classList.add("disabled"));

        // 1.5 saniye bekle ve sonraki soruya geç
        setTimeout(() => {
            currentIdx++;
            if (currentIdx < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, 1500);
    }

    async function showResult() {
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-screen").style.display = "block";
        document.getElementById("final-score").innerText = `${score} / ${questions.length}`;

        try {
            const { error } = await _supabase.from('skorlar').insert([{ puan: score }]);
            document.getElementById("status").innerText = error ? "❌ Kayıt başarısız" : "✅ Skor Supabase'e kaydedildi!";
        } catch (err) {
            document.getElementById("status").innerText = "❌ Bağlantı hatası";
        }
    }

    loadQuestion();
</script>

</body>
</html>
