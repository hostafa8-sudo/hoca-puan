<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hukuk Reformu Projesi</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; display: flex; justify-content: center; padding: 20px; margin: 0; }
        .container { max-width: 700px; width: 100%; background: #16213e; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; }
        .header { background: #e94560; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; letter-spacing: 1px; }
        .img-box { width: 100%; line-height: 0; }
        img { width: 100%; height: auto; display: block; border-bottom: 5px solid #e94560; }
        .info { padding: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #0f3460; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #16213e; }
        th { background: #0f3460; color: #e94560; width: 35%; font-size: 14px; text-transform: uppercase; }
        td { font-size: 15px; color: #ced4da; }
        .footer { padding: 15px; text-align: center; font-size: 11px; color: #533483; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">⚖️ URKAGİNA HUKUK REFORMU</div>
        <div class="img-box">
            <img src="https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&q=80&w=1000" alt="Hukuk Görseli">
        </div>
        <div class="info">
            <table>
                <tr><th>Hazırlanan Ürün</th><td>Hukuk Temalı Dijital Görsel</td></tr>
                <tr><th>İncelenecek Kaynak</th><td>Sümer Tabletleri ve Tarihi Metinler</td></tr>
                <tr><th>Benzerlikler</th><td>Adalet vurgusu ve tarihi doku korunmuştur.</td></tr>
                <tr><th>Farklılıklar</th><td>Dijital tasarım ile veriler modernize edilmiştir.</td></tr>
            </table>
        </div>
        <div class="footer">Eyapay & Termux Proje Geliştirme Sistemi</div>
    </div>
</body>
</html>
